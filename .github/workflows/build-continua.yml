name: Build continua e prerelease

on:
  push:
    branches: [main]

permissions:
  contents: read

# Nessun gruppo concurrency: GitHub può sostituire i run in attesa anche con
# cancel-in-progress: false, perdendo così i commit di un push.
jobs:
  build:
    name: Build e test di ogni commit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verifica gli script della pipeline
        run: python3 -m unittest discover -s .github/tests -v
      - name: Costruisci tutti i nuovi commit
        env:
          GH_TOKEN: ${{ github.token }}
          RISULTATI: ${{ runner.temp }}/risultati
        run: python3 .github/scripts/build_continua.py build
      - name: Conserva JAR, log e risultati per SHA
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/risultati
          if-no-files-found: error
          retention-days: 14

  pubblica:
    name: Pubblica solo le build riuscite
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/risultati
      - name: Pubblica prerelease senza eseguire il codice dei commit
        env:
          GH_TOKEN: ${{ github.token }}
          RISULTATI: ${{ runner.temp }}/risultati
        run: python3 .github/scripts/build_continua.py pubblica
