# Aggiornamenti di versione: Dependabot apre una PR a settimana per le dipendenze
# Maven e per le action dei workflow. Gli aggiornamenti di sicurezza (security updates)
# si attivano a parte, in Settings → Advanced Security.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Per GitHub Actions include /.github/workflows.
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
