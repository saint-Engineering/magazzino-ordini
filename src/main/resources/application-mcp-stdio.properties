# Profilo mcp-stdio (M7 G3): l'applicazione parte senza pagine web e parla MCP su
# stdin e stdout. Lo usa il cloud agent, che avvia il jar come processo:
#   java -jar target/magazzino-ordini.jar --spring.profiles.active=mcp-stdio
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.ai.mcp.server.stdio=true

# stdout è il canale del protocollo: qualunque riga di log lo romperebbe.
# Log solo su file.
logging.pattern.console=
logging.file.name=target/mcp-stdio.log
