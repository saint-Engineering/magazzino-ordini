<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{fragments :: head('Nuovo prodotto')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main>
    <h1>Censimento nuovo prodotto</h1>
    <div th:replace="~{fragments :: avvisi}"></div>
    <form th:action="@{/prodotti/nuovo}" th:object="${form}" method="post">
        <label>Codice
            <input type="text" th:field="*{codice}" maxlength="255" required>
        </label>
        <label>Nome
            <input type="text" th:field="*{nome}" maxlength="255" required>
        </label>
        <label>Prezzo (€)
            <input type="number" th:field="*{prezzo}" min="0" step="0.01" required>
        </label>
        <label>Scorta minima
            <input type="number" th:field="*{scortaMinima}" min="0" required>
        </label>
        <p>Il prodotto viene censito con giacenza iniziale pari a zero.</p>
        <button type="submit" class="primario">Censisci</button>
        <a th:href="@{/prodotti}">Annulla</a>
    </form>
</main>
</body>
</html>
