<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{fragments :: head('Ordine')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main>
    <h1>Ordine <span th:text="${ordine.id}">1</span>
        <span class="stato" th:classappend="${#strings.toLowerCase(ordine.stato)}" th:text="${ordine.stato}">CONFERMATO</span>
    </h1>
    <p>Cliente: <strong th:text="${ordine.cliente}">Rossi srl</strong>
        · creato il <span th:text="${#temporals.format(ordine.creatoIl, 'dd/MM/yyyy HH:mm')}">21/10/2026</span></p>
    <p th:if="${ordine.codiceTracking != null}">Codice di tracking:
        <strong th:text="${ordine.codiceTracking}">IT123456789IT</strong></p>
    <div th:replace="~{fragments :: avvisi}"></div>
    <table>
        <thead>
        <tr>
            <th>Prodotto</th>
            <th class="num">Quantità</th>
            <th class="num">Prezzo</th>
            <th class="num">Sconto</th>
            <th class="num">Subtotale</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${ordine.righe}">
            <td th:text="${r.prodotto.nome}">Viti</td>
            <td class="num" th:text="${r.quantita}">10</td>
            <td class="num" th:text="${#numbers.formatDecimal(r.prezzoUnitario, 1, 'POINT', 2, 'COMMA')} + ' €'">6,90 €</td>
            <td class="num" th:text="${r.scontoPercentuale()} + '%'">5%</td>
            <td class="num" th:text="${#numbers.formatDecimal(r.subtotale(), 1, 'POINT', 2, 'COMMA')} + ' €'">69,00 €</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="4">Totale merce</th>
            <th class="num" th:text="${#numbers.formatDecimal(ordine.totale(), 1, 'POINT', 2, 'COMMA')} + ' €'">69,00 €</th>
        </tr>
        <tr>
            <td colspan="4">Spedizione</td>
            <td class="num" th:text="${#numbers.formatDecimal(ordine.speseSpedizione(), 1, 'POINT', 2, 'COMMA')} + ' €'">9,90 €</td>
        </tr>
        <tr>
            <th colspan="4">Totale da pagare</th>
            <th class="num" th:text="${#numbers.formatDecimal(ordine.totaleDaPagare(), 1, 'POINT', 2, 'COMMA')} + ' €'">75,45 €</th>
        </tr>
        </tfoot>
    </table>
    <div class="azioni" th:if="${ordine.stato.name() == 'CONFERMATO'}">
        <form th:action="@{/ordini/{id}/spedisci(id=${ordine.id})}" method="post">
            <label for="codiceTracking">Codice di tracking</label>
            <input id="codiceTracking" name="codiceTracking" type="text"
                   placeholder="IT123456789IT" pattern="IT[0-9]{9}IT"
                   minlength="13" maxlength="13" required>
            <button type="submit" class="primario">Spedisci</button>
        </form>
        <form th:action="@{/ordini/{id}/annulla(id=${ordine.id})}" method="post">
            <button type="submit">Annulla ordine</button>
        </form>
    </div>
</main>
</body>
</html>
