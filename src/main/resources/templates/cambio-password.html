<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{fragments :: head('Cambia password')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main>
    <h1>Cambia password</h1>
    <div th:replace="~{fragments :: avvisi}"></div>
    <form th:action="@{/profilo/password}" th:object="${form}" method="post">
        <label>Password attuale
            <input type="password" th:field="*{passwordAttuale}" autocomplete="current-password" required>
        </label>
        <label>Nuova password
            <input type="password" th:field="*{nuovaPassword}" minlength="8" maxlength="128"
                   autocomplete="new-password" required>
        </label>
        <label>Conferma nuova password
            <input type="password" th:field="*{confermaPassword}" minlength="8" maxlength="128"
                   autocomplete="new-password" required>
        </label>
        <button type="submit" class="primario">Aggiorna password</button>
    </form>
</main>
</body>
</html>
