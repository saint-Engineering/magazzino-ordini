spring.application.name=magazzino-ordini

# Database H2 in memoria: lo schema lo crea Hibernate, i dati di prova DatiIniziali.
# A ogni riavvio si riparte dal catalogo iniziale.
spring.datasource.url=jdbc:h2:mem:magazzino;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Thymeleaf: in sviluppo le pagine si ricaricano senza riavviare l'applicazione
spring.thymeleaf.cache=false

# McpServerConfig registra tre server Streamable HTTP con cataloghi distinti.
# Disabilita il server unico e la registrazione automatica di tutti i tool.
spring.ai.mcp.server.enabled=false
spring.ai.mcp.server.annotation-scanner.enabled=false
