spring.application.name=magazzino-ordini

# Database H2 in memoria: lo schema lo crea Hibernate, i dati di prova DatiIniziali.
# A ogni riavvio si riparte dal catalogo iniziale.
spring.datasource.url=jdbc:h2:mem:magazzino;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Thymeleaf: in sviluppo le pagine si ricaricano senza riavviare l'applicazione
spring.thymeleaf.cache=false

# MCP server (Spring AI): gli stessi casi d'uso delle pagine, esposti come tool agli agenti.
# protocol va scritto: se manca, Spring AI 2.0 configura il vecchio trasporto SSE.
spring.ai.mcp.server.name=magazzino
spring.ai.mcp.server.version=0.3.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Magazzino & Ordini: catalogo, scorte e ordini. \
  Rispondi con i tool di lettura; riassortisci_prodotto modifica la giacenza \
  e va usato solo su richiesta esplicita dell'utente.
